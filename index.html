<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA essentials -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1B6B8A" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProNeighbor" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- Splash screen background colour (shows while app loads on iOS) -->
    <meta name="msapplication-TileColor" content="#1B6B8A" />
    <meta name="msapplication-TileImage" content="/images/logo.png" />

    <!-- SEO / share -->
    <meta name="description" content="Your society's professional network. Book verified experts who live in your gated community." />
    <meta property="og:title" content="ProNeighbor — Your Society's Professional Network" />
    <meta property="og:description" content="Book verified CAs, doctors, yoga coaches and more — professionals who live in your own gated community. Launching May 2026 at Park Street, Wakad." />
    <meta property="og:image" content="https://neighbhorpro.web.app/images/hero-bg.jpg" />
    <meta property="og:url" content="https://neighbhorpro.web.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProNeighbor — Your Society's Professional Network" />
    <meta name="twitter:description" content="Verified professionals inside your gates. Launching May 2026." />
    <meta name="twitter:image" content="https://neighbhorpro.web.app/images/hero-bg.jpg" />

    <link rel="icon" type="image/png" href="/images/logo.png" />
    <title>ProNeighbor — Your Society's Professional Network</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register service worker only in production. -->
    <script type="module">
      if (!('serviceWorker' in navigator)) {
        // Browser doesn't support service workers.
      } else if (import.meta.env.PROD) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .catch((err) => console.warn('SW registration failed:', err));
        });
      } else {
        // In dev, clear any previously registered SW to avoid Vite/HMR conflicts.
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
      }
    </script>
  </body>
</html>
